[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datacontext"
version = "0.1.0"
description = "Runtime attribution for data access in Python."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
  { name = "DataContext contributors" }
]
keywords = ["database", "observability", "tracing", "attribution", "opentelemetry"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/data-context-hq/datacontext"
Repository = "https://github.com/data-context-hq/datacontext"
Issues = "https://github.com/data-context-hq/datacontext/issues"
Changelog = "https://github.com/data-context-hq/datacontext/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/data-context-hq/datacontext/blob/main/ROADMAP.md"
Security = "https://github.com/data-context-hq/datacontext/security"

[project.optional-dependencies]
otel = [
  "opentelemetry-api>=1.20",
]
sqlalchemy = [
  "SQLAlchemy>=1.4",
]
dagster = [
  "dagster>=1.8",
  ]
snowflake = [
  "snowflake-connector-python>=3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/datacontext"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]
exclude = [
  "/.gitignore",
]
